read_parameter:
  name: Read Parameter
  description: Read a single ebusd register by circuit and name.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    field:
      default: "value"
      selector:
        text:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

write_parameter:
  name: Write Parameter
  description: Write a value to an ebusd register with verification.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

set_mode_override:
  name: Set Mode Override
  description: Write eloBLOCK B510 thermostat override and optionally keep it alive.
  fields:
    flow_temperature:
      name: Flow Temperature
      required: true
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: °C
    storage_temperature:
      name: Storage Temperature
      required: true
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: °C
    mode:
      name: Heating Mode
      default: 0
      selector:
        number:
          min: 0
          max: 255
          step: 1
    keep_alive:
      name: Keep Alive
      default: true
      selector:
        boolean:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded.
      advanced: true
      selector:
        text:

clear_mode_override:
  name: Clear Mode Override
  description: Stop sending the eloBLOCK B510 thermostat override.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded.
      advanced: true
      selector:
        text:

refresh:
  name: Refresh
  description: Force re-read of all active registers.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

rediscover:
  name: Rediscover
  description: Re-run entity discovery via `find` command.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

analyze_registers:
  name: Analyze Registers
  description: Run background analysis on-demand to discover and enable new devices and entities.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

export_discovery_dump:
  name: Export Discovery Dump
  description: >-
    Export discovered registers and the full REGISTER_MAP to YAML for
    troubleshooting. Current ebusd versions grab globally at startup. When a
    grab is already active, the service compares before/after message counts
    without stopping the shared capture. Results are deduplicated to the latest
    payload per message key; identical visible rows are coalesced by summing
    counts. ebusd exposes no capture epoch, so an external
    `grab`/`grab stop` command or daemon restart during export can make counts
    ambiguous; do not run those commands or restart ebusd until the service
    finishes. If the connection drops before ebusd confirms `grab started`, the
    service will not send an unowned stop command, so ebusd may keep grabbing.
    Run only one export per ebusd endpoint at a time, including across separate
    Home Assistant instances.
  fields:
    grab_duration:
      name: Grab Duration
      description: Capture raw eBUS traffic for N seconds before final dump (0 = disable; auto-grab sessions use count deltas)
      advanced: true
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:
